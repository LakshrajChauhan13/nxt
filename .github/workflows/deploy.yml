name: Node.js CI/CD to AWS EC2

on:
  push:
    branches: [ main ] # Triggers the script whenever you push code to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code from Repository
      uses: actions/checkout@v4

    - name: Deploy to EC2 via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        port: 22
        script: |
          # 1. Navigate to the application root directory
          cd /var/www/my-next-app

          # 2. Pull the latest code down from your repository
          # Note: For an initial simple test setup, we can clean and sync files directly
          # Alternative for absolute simplicity: Clone/pull using git or rsync. 
          # To keep this clean, let's clone the repo if empty, or pull if it exists:
          if [ -d ".git" ]; then
            git reset --hard HEAD
            git pull origin main
          else
            git clone https://github.com{{ github.repository }}.git .
          fi

          # 3. Install production dependencies and build the Next.js app
          npm install
          npm run build

          # 4. Start or Reload the application using PM2 to prevent downtime
          pm2 describe next-app > /dev/null-app
          if [ $? -eq 0 ]; then
            pm2 reload next-app
          else
            pm2 start npm --name "next-app" -- stories start
          fi