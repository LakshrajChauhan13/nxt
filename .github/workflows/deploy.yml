name: Node.js CI/CD to AWS EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code from Repository
      uses: actions/checkout@v4

    - name: Deploy to EC2 via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_DEPLOY_PRIVATE_KEY }}
        port: 22
        script: |
          # 1. Force the headless shell to load your environment path variables
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          source $HOME/.bashrc
          export PATH=$PATH:/usr/bin:/usr/local/bin:$HOME/.npm-global/bin

          # 2. Navigate to the application root directory
          cd /var/www/my-next-app

          # 3. Synchronize your public repository code to the workspace
          if [ -d ".git" ]; then
            git reset --hard HEAD
            git remote set-url origin https://github.com{{ github.repository }}.git
            git pull origin main
          else
            git clone https://github.com{{ github.repository }}.git .
          fi

          # 4. Install production dependencies and compile Next.js app
          npm install
          npm run build

          # 5. Manage background service tasks with PM2 safely
          pm2 describe next-app > /dev/null 2>&1
          if [ $? -eq 0 ]; then
            pm2 reload next-app
          else
            pm2 start npm --name "next-app" -- start
          fi
